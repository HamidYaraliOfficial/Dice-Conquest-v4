<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dice Conquest</title><meta name="color-scheme" content="dark"><meta name="theme-color" content="#070b12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="data:,"></head><body>
<div id="menu" class="scr on"><h1 class="logo">DICE CONQUEST</h1><p class="sub" data-t="sub"></p>
<button class="btn pri" id="bCont" data-t="cont"></button><button class="btn" id="bNew" data-t="newgame"></button><button class="btn" id="bQuick" data-t="quick"></button><button class="btn" id="bHow" data-t="how"></button><button class="btn" id="bSet" data-t="settings"></button><button class="btn" id="bAbout" data-t="about"></button>
<select id="lang"><option value="en">English</option><option value="fa">فارسی</option><option value="zh">简体中文</option></select></div>

<div id="setup" class="scr"><div class="card"><h2 data-t="newgame"></h2>
<div class="row"><label data-t="players"></label><input type="number" id="sP" min="2" max="8" value="4"></div>
<div class="row"><label data-t="humans"></label><input type="number" id="sH" min="0" max="8" value="1"></div>
<div class="row"><label data-t="diff"></label><select id="sD"><option value="1" data-t="easy"></option><option value="2" data-t="normal" selected></option><option value="3" data-t="hard"></option></select></div>
<div class="row"><label data-t="size"></label><select id="sS"><option value="world" data-t="world"></option></select></div>
<div class="row"><label data-t="teams"></label><select id="sT"><option value="0" data-t="noTeams"></option><option value="2" data-t="teams2"></option><option value="3" data-t="teams3"></option></select></div>
<div id="ros"></div>
<div class="row"><label data-t="seed"></label><input type="text" id="sSeed" placeholder="random"></div>
<div class="row"><label data-t="sound"></label><input type="checkbox" id="sSnd" checked></div>
<div class="row"><button class="btn" id="sBack" data-t="back"></button><button class="btn pri" id="sGo" data-t="start"></button></div></div></div>

<div id="how" class="scr"><div class="card"><h2 data-t="how"></h2><div id="howT"></div><button class="btn" data-back data-t="back"></button></div></div>
<div id="sett" class="scr"><div class="card"><h2 data-t="settings"></h2>
<div class="row"><label data-t="sound"></label><input type="checkbox" id="oSnd"></div>
<div class="row"><label data-t="music"></label><input type="checkbox" id="oMus"></div>
<div class="row"><label data-t="names"></label><input type="checkbox" id="oNames"></div>
<div class="row"><label data-t="nums"></label><input type="checkbox" id="oNums"></div>
<div class="row"><label data-t="anim"></label><select id="oAnim"><option value="1" data-t="full"></option><option value="0" data-t="reduced"></option></select></div>
<div class="row"><label data-t="speed"></label><select id="oSp"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option></select></div>
<div class="row"><label data-t="language"></label><select id="lang2"><option value="en">English</option><option value="fa">فارسی</option><option value="zh">简体中文</option></select></div>
<div class="row"><button class="btn" id="oReset" data-t="reset"></button><button class="btn" data-back data-t="back"></button></div></div></div>
<div id="about" class="scr" style="align-items:center;justify-content:center"><div class="card"><h2>Dice Conquest</h2><p data-t="aboutT"></p><button class="btn" data-back data-t="back"></button></div></div>

<div id="game" class="scr"><div id="hud"></div><div id="mid"><div id="mapw"><svg id="map"></svg><div id="toast"></div><div id="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zr">⌂</button></div>
<div id="bt"><div class="bx"><div class="side" id="bA"></div><div class="vs">VS</div><div class="side" id="bD"></div></div></div></div>
<div id="side"><div id="pls"></div><div id="info"></div></div></div>
<div id="bar"><div id="hist"></div><b id="reinf"></b><button class="btn" id="bMenu" style="min-width:90px" data-t="menu"></button><button class="btn pri" id="bEnd" data-t="endturn"></button></div></div>
<div id="vic"><div class="card" id="vicC" style="text-align:center"></div></div>

<script type="module" src="/src/main.js"></script></body></html>
